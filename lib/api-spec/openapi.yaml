openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DIGITAL METAMORPHOSIS service catalog API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: services
    description: Service catalog operations
  - name: categories
    description: Category operations
  - name: cloud-components
    description: Cloud component operations
  - name: agents
    description: AI agent environment and runtime operations
  - name: requests
    description: Service request operations
  - name: stats
    description: Catalog statistics
  - name: resources
    description: Infrastructure resource operations
  - name: control-plane
    description: DIGITAL METAMORPHOSIS internal control-plane operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /stats:
    get:
      operationId: getCatalogStats
      tags: [stats]
      summary: Get catalog statistics
      responses:
        "200":
          description: Catalog stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogStats"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List services with optional filtering
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /services/featured:
    get:
      operationId: getFeaturedServices
      tags: [services]
      summary: Get featured/highlighted services for homepage
      responses:
        "200":
          description: Featured services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /services/{slug}:
    get:
      operationId: getServiceBySlug
      tags: [services]
      summary: Get service by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Service detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cloud-components:
    get:
      operationId: listCloudComponents
      tags: [cloud-components]
      summary: List cloud components with optional filters
      parameters:
        - name: provider
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of cloud components
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CloudComponent"

  /agents:
    get:
      operationId: listAgentEnvironments
      tags: [agents]
      summary: List AI agent environments
      responses:
        "200":
          description: List of agent environments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentEnvironment"

  /agents/runtime:
    get:
      operationId: getAgentRuntimeStatus
      tags: [agents]
      summary: Get safe agent runtime readiness
      description: Returns capability readiness only. Secret values are never exposed.
      responses:
        "200":
          description: Agent runtime readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRuntimeStatus"

  /agents/{id}:
    get:
      operationId: getAgentEnvironment
      tags: [agents]
      summary: Get agent environment detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent environment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEnvironment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /control-plane/status:
    get:
      operationId: getControlPlaneStatus
      tags: [control-plane]
      summary: Get safe control-plane operational status
      description: Returns worker, queue, and telemetry health without exposing credentials or payloads.
      responses:
        "200":
          description: Control-plane status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlPlaneStatus"

  /control-plane/workers/register:
    post:
      operationId: registerControlPlaneWorker
      tags: [control-plane]
      summary: Register an internal control-plane worker
      security:
        - ControlPlaneWorkerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlPlaneWorkerInput"
      responses:
        "201":
          description: Worker registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlPlaneWorker"
        "401":
          description: Worker authentication failed
        "503":
          description: Worker capability is not configured

  /control-plane/workers/{workerId}/heartbeat:
    post:
      operationId: heartbeatControlPlaneWorker
      tags: [control-plane]
      summary: Record a control-plane worker heartbeat
      security:
        - ControlPlaneWorkerToken: []
      parameters:
        - name: workerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlPlaneHeartbeatInput"
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlPlaneWorker"
        "401":
          description: Worker authentication failed
        "404":
          description: Worker not found

  /control-plane/jobs:
    post:
      operationId: enqueueControlPlaneJob
      tags: [control-plane]
      summary: Enqueue a durable internal job
      security:
        - ControlPlaneWorkerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlPlaneJobInput"
      responses:
        "201":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlPlaneJob"
        "401":
          description: Worker authentication failed

  /control-plane/jobs/claim:
    post:
      operationId: claimControlPlaneJob
      tags: [control-plane]
      summary: Claim the next queued internal job
      security:
        - ControlPlaneWorkerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlPlaneJobClaimInput"
      responses:
        "200":
          description: Claimed job or null when the queue is empty
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: "#/components/schemas/ControlPlaneJob"
        "401":
          description: Worker authentication failed

  /control-plane/jobs/{id}/complete:
    post:
      operationId: completeControlPlaneJob
      tags: [control-plane]
      summary: Complete or fail a claimed internal job
      security:
        - ControlPlaneWorkerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlPlaneJobCompletionInput"
      responses:
        "200":
          description: Job updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlPlaneJob"
        "401":
          description: Worker authentication failed
        "404":
          description: Job not found

  /control-plane/telemetry:
    post:
      operationId: ingestControlPlaneTelemetry
      tags: [control-plane]
      summary: Ingest an internal control-plane telemetry event
      security:
        - ControlPlaneWorkerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlPlaneTelemetryInput"
      responses:
        "201":
          description: Telemetry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlPlaneTelemetry"
        "401":
          description: Worker authentication failed

  /requests:
    post:
      operationId: submitServiceRequest
      tags: [requests]
      summary: Submit a service inquiry/request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestInput"
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listServiceRequests
      tags: [requests]
      summary: List all submitted service requests
      responses:
        "200":
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRequest"

  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List infrastructure resources
      parameters:
        - name: region
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"

components:
  securitySchemes:
    ControlPlaneWorkerToken:
      type: apiKey
      in: header
      name: X-Digital-Metamorphosis-Worker-Token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    CatalogStats:
      type: object
      properties:
        totalServices:
          type: integer
        totalCategories:
          type: integer
        totalCloudComponents:
          type: integer
        totalAgentEnvironments:
          type: integer
        totalRequests:
          type: integer
        totalResources:
          type: integer
      required:
        - totalServices
        - totalCategories
        - totalCloudComponents
        - totalAgentEnvironments
        - totalRequests
        - totalResources

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        icon:
          type: string
        serviceCount:
          type: integer
      required:
        - id
        - name
        - slug
        - serviceCount

    Service:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        categoryId:
          type: string
        categoryName:
          type: string
        provider:
          type: string
        region:
          type: string
        status:
          type: string
          enum: [active, inactive, maintenance, deprecated]
        pricing:
          type: string
        pricingDetails:
          type: string
        tags:
          type: array
          items:
            type: string
        featured:
          type: boolean
        isFeatured:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - slug
        - name
        - description
        - provider
        - region
        - status
        - featured

    CloudComponent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        provider:
          type: string
        region:
          type: string
        status:
          type: string
          enum: [active, inactive, maintenance, deprecated]
        version:
          type: string
        uptime:
          type: string
        latency:
          type: string
        tags:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - slug
        - provider
        - region
        - status

    AgentEnvironment:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [production, research, devops, staging]
        status:
          type: string
          enum: [active, inactive, maintenance]
        agentCount:
          type: integer
        activeAgents:
          type: integer
        agents:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
      required:
        - id
        - name
        - slug
        - type
        - status
        - agentCount
        - activeAgents

    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        model:
          type: string
        status:
          type: string
        role:
          type: string
      required:
        - id
        - name
        - status

    AgentRuntimeStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ready, degraded]
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/AgentCapability"
      required:
        - status
        - capabilities

    AgentCapability:
      type: object
      properties:
        id:
          type: string
        configured:
          type: boolean
      required:
        - id
        - configured

    ControlPlaneWorker:
      type: object
      properties:
        id:
          type: string
        workerId:
          type: string
        name:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [online, offline, draining, degraded]
        capabilities:
          type: array
          items:
            type: string
        registeredAt:
          type: string
          format: date-time
        lastHeartbeatAt:
          type: string
          format: date-time
      required:
        - id
        - workerId
        - name
        - status
        - capabilities
        - registeredAt

    ControlPlaneWorkerInput:
      type: object
      properties:
        workerId:
          type: string
        name:
          type: string
        version:
          type: string
        capabilities:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
      required:
        - workerId
        - name

    ControlPlaneHeartbeatInput:
      type: object
      properties:
        status:
          type: string
          enum: [online, draining, degraded]
        version:
          type: string
        metrics:
          type: object
          additionalProperties: true

    ControlPlaneJob:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        priority:
          type: integer
        payload:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
        workerId:
          type: string
        attempts:
          type: integer
        maxAttempts:
          type: integer
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - status
        - priority
        - attempts
        - maxAttempts
        - createdAt

    ControlPlaneJobInput:
      type: object
      properties:
        type:
          type: string
        priority:
          type: integer
        payload:
          type: object
          additionalProperties: true
        maxAttempts:
          type: integer
      required:
        - type

    ControlPlaneJobClaimInput:
      type: object
      properties:
        workerId:
          type: string
        capabilities:
          type: array
          items:
            type: string
      required:
        - workerId

    ControlPlaneJobCompletionInput:
      type: object
      properties:
        workerId:
          type: string
        status:
          type: string
          enum: [completed, failed]
        result:
          type: object
          additionalProperties: true
        error:
          type: string
      required:
        - workerId
        - status

    ControlPlaneTelemetryInput:
      type: object
      properties:
        source:
          type: string
        eventType:
          type: string
        severity:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        workerId:
          type: string
        metrics:
          type: object
          additionalProperties: true
      required:
        - source
        - eventType
        - message

    ControlPlaneTelemetry:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
        eventType:
          type: string
        severity:
          type: string
        message:
          type: string
        workerId:
          type: string
        recordedAt:
          type: string
          format: date-time
      required:
        - id
        - source
        - eventType
        - severity
        - message
        - recordedAt

    ControlPlaneStatus:
      type: object
      properties:
        status:
          type: string
          enum: [operational, degraded, offline]
        workerCount:
          type: integer
        onlineWorkerCount:
          type: integer
        queuedJobs:
          type: integer
        runningJobs:
          type: integer
        completedJobs24h:
          type: integer
        failedJobs24h:
          type: integer
        telemetry24h:
          type: integer
        lastEventAt:
          type: string
          format: date-time
        workers:
          type: array
          items:
            $ref: "#/components/schemas/ControlPlaneWorker"
      required:
        - status
        - workerCount
        - onlineWorkerCount
        - queuedJobs
        - runningJobs
        - completedJobs24h
        - failedJobs24h
        - telemetry24h
        - workers

    ServiceRequestInput:
      type: object
      properties:
        serviceId:
          type: string
        serviceName:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        organization:
          type: string
        notes:
          type: string
      required:
        - serviceName
        - contactName
        - contactEmail

    ServiceRequest:
      type: object
      properties:
        id:
          type: string
        serviceId:
          type: string
        serviceName:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        organization:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [pending, in_review, approved, rejected]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - serviceName
        - contactName
        - contactEmail
        - status
        - createdAt

    Resource:
      type: object
      properties:
        id:
          type: string
        location:
          type: string
        status:
          type: string
        priority:
          type: string
        region:
          type: string
        type:
          type: string
          enum: [CPU, GPU, HYBRID]
        quantity:
          type: integer
      required:
        - id
        - location
        - status
        - priority
        - region
        - type
        - quantity
